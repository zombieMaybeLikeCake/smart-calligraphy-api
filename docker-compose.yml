services:
  api:
    build: .
    image: smart-calligraphy-api:1.0.0
    ports:
      # 只綁 loopback：frpc（NSSM 服務，跑在同一台主機上）連得到 127.0.0.1:8000，
      # 跟目前已經驗證過能透過 frp 對外存取的那組設定一致；同一個區網的其他機器連不到。
      - "127.0.0.1:8000:8000"
    environment:
      DEVICE: cuda
      # 從主機環境變數 / .env 讀，不寫死在這個檔案裡（這個檔案會進 git）。
      # 沒設就是空字串，等同 app/main.py 裡 api_key="" 的「不驗證」預設，
      # 服務要掛公網之前務必先設好，見 README。
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_PREDICT: ${RATE_LIMIT_PREDICT:-10/minute}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
